<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<link rel="stylesheet" href="./tdl.css">

<body>
    <div class="app">
        <h1>📝 To Do List</h1>

        <!-- 新增事项 -->
        <form class="add-form" id="addForm">
            <input type="text" placeholder="输入待做事项,回车添加" id="todoInput" autocomplete="off">

            <button type="submit">添加</button>
        </form>


        <!-- 待做事项 -->
        <div class="section">
            <div class="section-title">
                <span>
                    待做事项
                    <span class="count" id="todoCount">0</span>
                </span>
            </div>
            <ul class="list" id="todoList"></ul>
        </div>


        <!-- 已完成事项 -->
        <div class="section">
            <div class="section-title">
                <span>
                    已完成事项
                    <span class="count" id="doneCount">0</span>
                </span>
                <button class="clear-btn" id="clearDone" type="button">清空已完成</button>
            </div>
            <ul class="list" id="doneList"></ul>
        </div>

    </div>
</body>
<script src="./tdl.js"></script>

</html>
