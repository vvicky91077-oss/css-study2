<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="btn">click</button>
</body>
<script>
    var name = 1111
    var obj1 = {
        name: " obj1111",
        getName: function(x,y,z){
            console.log("getName1",this.name,x,y,z)

        }
    }

     var obj2 = {
        name: " obj2222",
        getName: function(){
            console.log("getName2",this.name)
        }
    }
    // obj1.getName()
    // // obj1.getName(window.name)
    // obj2.getName()
    

    //call
    obj1.getName.call(obj2,1,5,0,2)
    obj1.getName.call(window)


    //apply
    obj1.getName.apply(obj2,[8,9,5,0])



    //bind
    obj1.getName.bind(obj2) //不会自动执行
    var obind =  obj1.getName.bind(obj2,0,2.5,7,8)
    console.log(obind)
    obind()

    console.log(".............")


    btn.onclick = handler.bind(window)

    function handler(){
        console.log(11111,this)
    }

</script>
