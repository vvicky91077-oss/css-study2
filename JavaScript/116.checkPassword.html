<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #myf{
            width: 300px;
            height: 100px;
            border: 1px solid saddlebrown;
            margin: 100px auto;
            border-radius: 10px;
            /* background-color: aqua; */

            
        }
        input{
            width: 250px;
            height: 30px;
            margin: 20px;
            margin-bottom: 5px;
        }
        p{
            display: flex;
        }
        form> p > span {
            width: 30%;
            height: 30px;
            border-radius: 10px;
            border: 1px solid grey;
            
            margin: 20px;
            margin-top: 5px;
           font-size: 15px;
           line-height: 30px;
            text-align: center;
            background-color: grey;
            color: white;

        }

        form>p>span:nth-child(1).active {
            background-color: red;
        }
        form>p>span:nth-child(2).active {
            background-color: rgb(209, 101, 209);
        }
        form>p>span:nth-child(3).active {
            background-color: rgb(20, 196, 32);
        }
    </style>
</head>
<body>
    <form action="" id="myf">
        <label for="">
            <input type="text">
        </label>
        <p>
            <span >weak</span>
            <span  >middle</span>
            <span  >strong</span>
        </p>
    </form>
</body>
<script>
    var inp= document.querySelector("input")
    // console.log(inp)

    var reg1 = /\d/
    var reg2 = /[a-z]/i
    var reg3 = /[~!@#$%^&*()`]/

    var ospan = document.querySelectorAll("span")
    // ospan.classList.remove("active")
    inp.oninput = function(e){
        // console.log(this.value)
        console.log(e.target.value)

        var level = 0

        if (reg1.test(this.value)) level++
        if (reg2.test(this.value)) level++
        if (reg3.test(this.value)) level++

        console.log(level)

        
        for (var i=0; i<ospan.length ; i++){
            ospan[i].classList.remove("active")
           if(i<level){
            ospan[i].classList.add("active")
           }
        }
    }
</script>
</html>
