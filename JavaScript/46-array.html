    <script>
        //sort 排序
        var a1 = [4, 3]
        // var temp =a1[0]
        // a1[0]=a1[1]

        // console.log(a1)




        for (var i = 0; i < a1.length; i++) {

                temp = a1[0]
                a1[0] = a1[1]
                a1[1] = temp
            }
        } console.log(a1)




        var a2 = [5, 70, 1, 55, 1546, 21, 3, 40, 4, 500, 99, 55, 44]
        for (var m = 0; m < a2.length - 1; m++) {
            for (var i = 0; i < a2.length - 1 - m; i++) {
                if (a2[i] > a2[i + 1]) {
                    temp = a2[i]
                    a2[i] = a2[i + 1]
                    a2[i + 1] = temp
                }

            }
        }

        console.log(a2)

        console.log("--------------------------------------")

    <script>
        var p = [4,8,20,5,9,1000]

        var aa=p.push('aaaa',88,'b0b') //最后面增加
        console.log(p)
        console.log(aa) //打印的是数量


        var bb=p.pop() //从最后面删除1个数据
        console.log(p)
        console.log(bb) //显示被删的值

        var cc= p.unshift('one',2,'three') //从最前面加
        console.log(p)
        console.log(cc) //打印的是数量

        var dd= p.shift() //从最前面删
        console.log(p)
        console.log(dd) //显示被删的值

        var ee= p.splice(1,1)// 从1下标删除1个
        console.log(p)
        console.log(ee)

        var ee= p.splice(1,1,555,666,777)
        var ff= p.splice( 4,0,8888)
        console.log(p)
        console.log(ff)


        var gg= p.sort(
            function abc(a,b){
                return a-b
            }
        )
        console.log(p)
        console.log(gg)



         var hh= p.sort(
            function abc(a,b){
                return b-a
            }
        )
        console.log(p)

    <script>
        //1-方法 去重

        var ff= [0,0,5,8.6,9,1,99,2,0,99]
        var fa= []

        for (var s=0; s<ff.length;s++){
            if (fa.indexOf(ff[s])===-1){
                fa.push(ff[s])
            }
        }
        console.log(ff,fa) //不排序只是去重



        //2-对象去重
        var fc= {}
        for(var i=0;i<ff.length;i++){
            fc[ff[i]]="aaaaa"
        }
        console.log(fc)

        var fx=[]
        for (var i in fc){
            fx.push(i-0)
        }
        console.log (fx)


        //set去重复
        var setone= new Set(ff)
        console.log(setone)
        
        var arrayone= Array.from(setone)
        console.log (arrayone)
        console.log("------------------------------------------------------------------------------")

    </script>
