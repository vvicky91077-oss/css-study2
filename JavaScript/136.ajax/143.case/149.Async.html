<body>
    <input type="text" id="mytext" placeholder="请输入内容">

<script  type="module">
    import {pajax} from './1.js'

    // console.log(ajax)

    class TodoList{
        constructor(select){
            this.listE=document.querySelector(select)
            this.listdata=[] //列表数据
            
            this.init()
        }

        init(){
            //初始化
            this.bindEvent()
            //获取数据
            this.getList()
        }


        bindEvent(){
            this.listE.onclick=(e)=>{
                // console.log(e.target)
                if(e.target.nodeName==="BUTTON"){
                    this.removeItem(e.target)
                }
            }
        }


        async removeItem(target){
            target.parentNode.remove()

            //获取自身的id值
            console.log(target.dataset.index)

            //删数据库里面
            await pajax({
            url:`http://localhost:3000/list/${target.dataset.index}` ,
            method: "DELETE"            
        })
                console.log("success")
            
    } 
       


        async getList(){
            //获取
            //then 写在里面 就不用 return 传出去
            await pajax({
            url: "http://localhost:3000/list",
            
            }).then(res=>{
                    this.listdata=res
                    this.render()
            }).catch(err=>{
                console.log("error",err)
            })
        }


        render(){
            // console.log("render")
            this.listE.innerHTML= this.listdata.map(item=>
            `<li>
                ${item.text}
                <button data-index=${item.id}>删除</button>
            </li>`).join("")
        }

        async addItem(text){
            // console.log(text)

            //先添加到数据库 再往页面增加
            var aa=await pajax({
            url: "http://localhost:3000/list",
            method: "POST",
            data: {
                text
            }            
        })
            this.listdata=[...this.listdata,aa]
            this.render()

        }
        
        updateItem(){

        }
    }
    


    var obj= new TodoList('.list')
    console.log(obj)


    myadd.onclick = function(){
        // console.log(mytext.value)
        obj.addItem(mytext.value)
    }
