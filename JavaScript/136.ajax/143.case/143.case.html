<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="mytext" placeholder="请输入内容">
    <button id="myadd">提交</button>
    <ul class="list">

    </ul>
</body>
<script  type="module">
    import ajax from './1.js'

    // console.log(ajax)

    class TodoList{
        constructor(select){
            this.listE=document.querySelector(select)
            this.listdata=[] //列表数据
            
            this.init()
        }

        init(){
            //初始化
            this.bindEvent()
            //获取数据
            this.getList()
        }


        bindEvent(){
            this.listE.onclick=(e)=>{
                // console.log(e.target)
                if(e.target.nodeName==="BUTTON"){
                    this.removeItem(e.target)
                }
            }
        }


        removeItem(target){
            target.parentNode.remove()

            //获取自身的id值
            console.log(target.dataset.index)

            //删数据库里面
            ajax({
            url:`http://localhost:3000/list/${target.dataset.index}` ,
            method: "DELETE",
            success: function (res) {
                console.log("success")
            },
            error: function (err) {
                console.log("error", err)
            }
        }) 
        }


        getList(){
            //获取
            ajax({
            url: "http://localhost:3000/list",
            success:  (res) =>{
                console.log("success", res)
                this.listdata=res

                this.render()
            },
            error: function (err) {
                console.log("error", err)
            }
        })
        }


        render(){
            // console.log("render")
            this.listE.innerHTML= this.listdata.map(item=>
            `<li>
                ${item.text}
                <button data-index=${item.id}>删除</button>
            </li>`).join("")
        }

        addItem(text){
            console.log(text)

            //先添加到数据库 再往页面增加
            ajax({
            url: "http://localhost:3000/list",
            method: "POST",
            data: {
                text
            },
            success:  (res) =>{
                console.log("success", res)
            //    location.reload() //刷新整个页面 加载
                
                this.listdata=[...this.listdata,res]
                this.render()

            },
            error: function (err) {
                console.log("error", err)
            }
        })

        }
        
        updateItem(){

        }
    }
    


    var obj= new TodoList('.list')
    console.log(obj)


    myadd.onclick = function(){
        // console.log(mytext.value)
        obj.addItem(mytext.value)
    }


</script>

</html>
