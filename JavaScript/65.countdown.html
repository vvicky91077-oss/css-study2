    function diffTime (current, target){
        var value = Math.floor(target - current)/1000 //get minutes
        console.log(value)
        
        var day = parseInt(value/(24*60*60)) //get day
        var hours = parseInt(value%(60*6024)/(60*60))
        var minutes = parseInt(value%(60*60)/60)
        var seconds = parseInt(value%60)

        var obj={
            day:day,
            hours:hours,
            minutes:minutes,
            seconds:seconds,
        }
            
        return obj
    }
