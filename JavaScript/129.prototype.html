     function CreateList1 (select,data){
        this.element= document.querySelector(select)
        this.title= data.title,
        this.list= data.list
        
        
    }
    CreateList1.prototype.render= function(){
        
        var h1 = this.element.querySelector("h1")
        var ul = this.element.querySelector("ul")
        // console.log(h1,ul)
        h1.innerHTML = this.title
        ul.innerHTML = this.list.map(item=>`<li>${item}</li>`)
        .join("")
    }
    var obj3=new CreateList1(".box1",data)
    obj3.render()

    obj4.render()
