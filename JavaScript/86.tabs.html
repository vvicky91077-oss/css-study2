<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
        }
        .header{
            display: flex;
            width: 500px;
        }
        .header li {
            height: 50px;
            line-height: 50px;
            text-align: center;
            flex: 1;
            border: 1px solid black;
        }
        .box {
            position: relative;
        }
        .box li{
            width: 498px;
            height: 300px;
            background-color: skyblue;
            position: absolute;
            left: 0;
            right: 0;
            border: 1px solid black;
            display: none;

        }
        .header .active {
            background-color: gold;
        }
        .box .active {
            display: block;
        }
    </style>
</head>
<body>
    <ul class="header">
        <li class="active">1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul>
     <ul class="box">
        <li class="active">******************</li>
        <li>--------------------</li>
        <li>+++++++++++++++++++++++++++</li>
        <li>.................................</li>
    </ul>
</body>
<script>
    var head = document.querySelectorAll(".header li")
    var content = document.querySelectorAll(".box li")

    for (var i =0;i<head.length;i++){

        head[i].dataset.index=[i]
        head[i].onclick =function(){
            var index = this.dataset.index

            for (var m=0; m<head.length;m++){
                head[m].classList.remove("active")
                content[m].classList.remove("active")
            }

            head[index].classList.add("active")
            content[index].classList.add("active")
        }
    }
</script>
</html>
