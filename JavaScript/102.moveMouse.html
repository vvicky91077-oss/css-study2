<script>

    isDown = false
    move.onmousedown = function () {
        // console.log("down")
        isDown = true

    }

    move.onmouseup = function () {
        // console.log("up")
        isDown = false

        document.onmousemove = null

    }

    document.onmousemove = function (e) {
        // console.log("move")
        if (!isDown) return
        var x = e.clientX - move.offsetWidth / 2
        var y = e.clientY - move.offsetHeight / 2

        if (y <= 0) y = 0
        if (x <= 0) x = 0

        if (x >= document.documentElement.clientWidth - move.offsetWidth)
            x = document.documentElement.clientWidth - move.offsetWidth

        if (y >= document.documentElement.clientHeight - move.offsetHeight)
            y = document.documentElement.clientHeight - move.offsetHeight

        move.style.left = x + "px"
        move.style.top = y + "px"
    }
</script>
