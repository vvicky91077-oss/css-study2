<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 500px;
            height: 500px;
            border: 2px solid black;
            margin: 100px auto;
            display: flex;
            flex-wrap: wrap;
            flex-direction: column;
        }

        .box div {
            width: 100px;
            /* background-color: aqua; */
            height: 100px;
            border: 1px dotted red;
            box-sizing: border-box;
            /* flex-direction: column; */
        }
        .box2{
            align-self: center;
        }
        .box3 {
            align-self: flex-end;
        }
        .box4 {
            align-self: baseline;
        }
        .box5 {
            /* height: none; */
            align-self: stretch;
        }
    </style>
</head>
<body>
    <div class="box">
        <div>1552</div>
        <div class="box2">222</div>
        <div class="box3">444</div>
        <div class="box4">7777</div>
        <div class="box5" >144441</div>
        


    </div>
</body>
</html>
