<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: skyblue;
        }
        div {
            width: 500px;
            height: 500px;
            margin: 20px auto;
            background: linear-gradient(black 50%,white 50%);
            display: flex;
            align-items: center;
            border-radius: 50%;
            transition: all 3s ;
            box-shadow: 20px 20px 20px #ccc,-20px -20px 20px grey;
            transform-origin: left bottom;
            transform-origin:  top left bottom;

        }
        div::before{
            content: "";
            width: 250px;
            height: 250px;
            background: blue;
            /* display: inline-block; */
            background:radial-gradient(white 25%,black 25%);
            border-radius: 50%;
        }
        div::after{
            content: "";
            width: 250px;
            height: 250px;
            background: rgb(183, 22, 81);
            /* display: inline-block; */
            background:radial-gradient(black 25%,white 25%);
            border-radius: 50%;
        }

        div:hover {
            transform: rotateZ(180deg);
            /* transform:rotateX(180deg) rotateY(180deg); */
        }
    </style>

</head>
<body>
    <div></div>
</body>
</html>
