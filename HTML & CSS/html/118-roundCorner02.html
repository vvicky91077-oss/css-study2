<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .box1 {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            background-color: blue;
            border-radius: 100px;
            border: 20px solid lightcoral;
            padding: 20px;
            
        }
        .box2 {
            width: 400px;
            height: 200px;
            margin: 0 auto;
            background-color: orangered;
            /* border-radius: 50px 30px 200px ; */
            /* border-radius: 250px; */
            border-radius: 200px 200px 0  0;
            border-radius: 0 0 200px 200px;
        }
        .box3 {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            background-color: rgb(127, 194, 44);
            /* border-radius: 200px 0 0 0; */
            /* border-radius: 0 200px 0 0; */
            /* border-radius: 0 0 200px 0; */
            border-radius: 0 0 0 200px;
            
            
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <br>
    <div class="box2"></div>
    <br>
    <div class="box3"></div>
</body>
</html>
