<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <div> 颜色选择：
            <input type="color" name="color">
        </div>
        <div> 邮箱：
            <input type="email" name="youxiang">
        </div>
        <div> url地址:
            <input type="url" name="url">
        </div>
        <div> 电话号码:
            <input type="tel" name="telno.">
        </div>
        <div> 滑块效果:
            <input type="range" name="range" min="10" max="100" value="19" step="10">
        </div>
        <div> 数字类型:
            <input type="number" name="no." min="15" max="150" value="18" step="1">
        </div>
        <div> 搜索:
            <input type="search" name="sousuo" >
        </div>
        <div> 日期选择框:
            <input type="date" name="date" >
        </div>
        <div> 月份选择框:
            <input type="datetime-local" name="MM" >
        </div>
        <br>
        <input type="submit">
    </form>
    
</body>
</html>
