<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        img {
            display: block;
        }

        #body {
            width: 263px;
            height: 364px;
            /* background-color: yellow; */
            margin: 0 auto;
            padding: 11px 11px 18px;
            box-sizing: border-box;
        }

        .title {
            height: 19px;
            /* background-color: red; */
            padding-left: 4px;
            border-left: 2px solid #254282;
            color: #254282;
            line-height: 19px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .box1 img {
            width: 241px;
            height: 170px;

        }

        .box1 p {
            width: 241px;
            height: 26px;
            background-color: #f6f7f8;
            font-size: 12px;
            text-align: center;
            line-height: 26px;
            margin-bottom: 16px;
        }
        .box2 {
            width: 241px;
            height: 90px;
        }
        .box2 .left img{
            width: 112px;
            height: 50px;
        }
        .box2 .right img{
            width: 112px;
            height: 50px;
        }
        

        .box2 .left {
            
            float: left;
            
        }
        .box2 p {
            font-size: 12px;
            width: 112px;
            background: #f6f7f8;
            

        
        }
        .box2 .right {
            float: right;
        }
    </style>
</head>

<body>
    <div id="body">
        <div class="title">美食图片</div>
        <div class="box1">
            <img src="./image.png" alt="这是煲仔饭" title="看见吗">
            <p>煲仔饭，煲仔饭，煲仔饭，****</p>
        </div>
        <div class="box2">
            <div class="left">
                <img src="./image copy.png" alt="" >
                <p>多肉果果果果果果果果果果果果果果果果</p>
            </div>
            <div class="right">
                <img src="./image copy 2.png" alt="">
                <p>漂亮的通透的果肉 真好看果果果果果果</p>
            </div>
        </div>
    </div>
</body>

</html>
