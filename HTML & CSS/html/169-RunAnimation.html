<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: red;
            animation: run 2s step-start infinite;
        }
        @keyframes run {
            0%{
                background: red;
            }
            50%{
                background: rgb(172, 24, 177);
            }
            100%{
                background: rgb(16, 177, 59);
            }
            
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
