<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:not(:first-child){
            background-color: saddlebrown;
        }
        li:not(:empty){
            background-color: aqua;
        }
        li:not(:nth-child(n+5)){
            background-color: plum;
        }
    </style>
</head>
<body>
    <ul>
        <li>1111111111</li>
        <li>222222222</li>
        <li>3333333333</li>
        <li></li>
        <li>222222222</li>
        <li>3333333333</li>
        <li></li>
        <li>222222222</li>
        <li>3333333333</li>
    </ul>
</body>
</html>
