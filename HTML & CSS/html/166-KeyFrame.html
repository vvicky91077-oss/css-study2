<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: rgb(45, 236, 96);
            animation: vk2 3s linear 1s  infinite ;
        }

        @keyframes vk {
            from {
                width: 300px;
                height: 300px;
                background-color: rgb(187, 137, 235);
            }

            to {
                width: 400px;
                height: 600px;
                background-color: rgb(38, 167, 186);
            }
        }
        @keyframes vk2 {
            0%{
                width: 100px;
                height: 100px;
                background-color:khaki;
            }
            30%{
                width: 100px;
                height: 200px;
                background-color:rgb(222, 153, 24);
            }
            50%{
                width: 200px;
                height: 300px;
                background-color:rgb(21, 192, 112);
            }
            100%{
                width: 200px;
                height: 600px;
                background-color:rgb(85, 77, 201);
            }
        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
