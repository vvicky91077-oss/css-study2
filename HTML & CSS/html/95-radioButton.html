<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h1>表单进阶- 单选框</h1>
    <div>
        你对于东京首页满意度如何
        <br>
        <label><input type="radio" name="gender" checked>非常满意</label>
        <br>
        <input type="radio" name="gender" id="disappointed"><label for="disappointed">一般</label>
        <br>
        <label><input type="radio" disabled>不满意</label>
    </div>
</body>
</html>
