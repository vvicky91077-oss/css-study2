<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            background: blue;
            transition-property: height border background;
            transition-duration: 2s;
            transition-timing-function: ease-in-out;
            transition-delay: 1s;

        div:hover {
            height: 500px;
            width: 500px;
            background: skyblue;
            border: 5px dotted burlywood;
            background: url(../Photo/QR.png) no-repeat;
        }
    </style>
</head>

    <div></div>
