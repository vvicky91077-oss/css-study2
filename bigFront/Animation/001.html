<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 经典动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            gap: 80px;
        }

        /* ========== 1. 波浪文字 ========== */
        .wave-text {
            display: flex;
            gap: 4px;
        }

        .wave-text span {
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            display: inline-block;
            animation: wave 1.4s ease-in-out infinite;
            text-shadow: 0 0 20px #7c3aed;
        }

        .wave-text span:nth-child(1)  { animation-delay: 0s;    color: #a78bfa; }
        .wave-text span:nth-child(2)  { animation-delay: 0.1s;  color: #818cf8; }
        .wave-text span:nth-child(3)  { animation-delay: 0.2s;  color: #60a5fa; }
        .wave-text span:nth-child(4)  { animation-delay: 0.3s;  color: #34d399; }
        .wave-text span:nth-child(5)  { animation-delay: 0.4s;  color: #fbbf24; }
        .wave-text span:nth-child(6)  { animation-delay: 0.5s;  color: #f87171; }
        .wave-text span:nth-child(7)  { animation-delay: 0.6s;  color: #fb923c; }

        @keyframes wave {
            0%, 100% { transform: translateY(0);   }
            50%       { transform: translateY(-24px); }
        }

        /* ========== 2. 旋转光环加载器 ========== */
        .loader-ring {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .loader-ring::before,
        .loader-ring::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 5px solid transparent;
        }

        .loader-ring::before {
            border-top-color: #a78bfa;
            border-right-color: #60a5fa;
            animation: spin 1s linear infinite;
        }

        .loader-ring::after {
            border-bottom-color: #34d399;
            border-left-color: #fbbf24;
            animation: spin 1.5s linear infinite reverse;
        }

        .loader-ring .dot {
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, #7c3aed, #1e1b4b);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1);    opacity: 1;   }
            50%       { transform: scale(1.15); opacity: 0.7; }
        }

        /* ========== 3. 跳动圆点 ========== */
        .dots {
            display: flex;
            gap: 14px;
            align-items: flex-end;
        }

        .dots span {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            animation: bounce 0.8s ease-in-out infinite alternate;
        }

        .dots span:nth-child(1) { background: #a78bfa; animation-delay: 0s;    }
        .dots span:nth-child(2) { background: #60a5fa; animation-delay: 0.15s; }
        .dots span:nth-child(3) { background: #34d399; animation-delay: 0.3s;  }
        .dots span:nth-child(4) { background: #fbbf24; animation-delay: 0.45s; }
        .dots span:nth-child(5) { background: #f87171; animation-delay: 0.6s;  }

        @keyframes bounce {
            from { transform: translateY(0);    box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
            to   { transform: translateY(-28px); box-shadow: 0 20px 20px rgba(0,0,0,0.1); }
        }

        /* ========== 4. 霓虹卡片翻转 ========== */
        .flip-card {
            width: 180px;
            height: 120px;
            perspective: 600px;
            cursor: pointer;
        }

        .flip-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: flip3d 3s ease-in-out infinite;
        }

        .flip-front,
        .flip-back {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .flip-front {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: #fff;
            box-shadow: 0 0 30px #7c3aed88;
        }

        .flip-back {
            background: linear-gradient(135deg, #059669, #0284c7);
            color: #fff;
            transform: rotateY(180deg);
            box-shadow: 0 0 30px #05966988;
        }

        @keyframes flip3d {
            0%, 35%  { transform: rotateY(0deg); }
            50%, 85% { transform: rotateY(180deg); }
            100%     { transform: rotateY(0deg); }
        }

        /* ========== 5. 粒子扩散圆环 ========== */
        .ripple-wrap {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .ripple-wrap .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid #a78bfa;
            animation: ripple 2s ease-out infinite;
            opacity: 0;
        }

        .ripple-wrap .ring:nth-child(2) { animation-delay: 0.6s; border-color: #60a5fa; }
        .ripple-wrap .ring:nth-child(3) { animation-delay: 1.2s; border-color: #34d399; }

        .ripple-wrap .center {
            position: absolute;
            inset: 35px;
            border-radius: 50%;
            background: #a78bfa;
            box-shadow: 0 0 20px #a78bfa;
        }

        @keyframes ripple {
            0%   { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* ========== 标签 ========== */
        .label {
            color: #4b5563;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: -60px;
        }

        .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* ========== 行布局 ========== */
        .row {
            display: flex;
            gap: 80px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- 波浪文字 -->
    <div class="section">
        <div class="wave-text">
            <span>C</span><span>S</span><span>S</span>
            <span style="width:20px"></span>
            <span>3</span><span>D</span>
        </div>
        <div class="label">Wave Text</div>
    </div>

    <!-- 中间一行：三个动画 -->
    <div class="row">
        <div class="section">
            <div class="loader-ring">
                <div class="dot"></div>
            </div>
            <div class="label">Ring Loader</div>
        </div>

        <div class="section">
            <div class="flip-card">
                <div class="flip-inner">
                    <div class="flip-front">FRONT</div>
                    <div class="flip-back">BACK</div>
                </div>
            </div>
            <div class="label">3D Flip</div>
        </div>

        <div class="section">
            <div class="ripple-wrap">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="center"></div>
            </div>
            <div class="label">Ripple</div>
        </div>
    </div>

    <!-- 跳动圆点 -->
    <div class="section">
        <div class="dots">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="label">Bounce Dots</div>
    </div>

</body>
</html>
