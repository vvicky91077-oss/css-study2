<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        div {
            width: 300px;
            height: 300px;
        }
        .box1{
            background-color: lawngreen;
            position: relative;
            top: 100px;
            left: 100px;
            z-index: 100;
        }
        .box2 {
            background-color: goldenrod;
            position: relative;
            z-index: 50;
        }
        
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
</body>
</html>
