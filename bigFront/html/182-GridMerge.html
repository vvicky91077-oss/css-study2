<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            width: 625px;
            height: 315px;
            border: 5px solid gray;
            display: grid;
            margin: 50px auto;
            grid-template-columns:repeat(6, 100px);
            grid-template-rows: repeat(3,100px);

           grid-gap: 5px 5px;
        }
        img {
            width: 100%;
            height: 100%;
        }
        .box img:nth-child(1){
            grid-column-start: 1;
            grid-column-end: 5;

            grid-row-start:1 ;
            grid-row-end: 3;
        }
        .box img:nth-child(2){
            grid-row: 3/4;
            grid-column: 1/3;
        }
        .box img:nth-child(3){
            grid-row: 3/4;
            grid-column: 3/4;
        }
        .box img:nth-child(4){
            grid-row: 3/4;
            grid-column: 4/5;
        }
        .box img:nth-child(6){
            grid-row: 1/2;
            grid-column: 5/7;
        }
        .box img:nth-child(5){
            grid-row: 2/4;
            grid-column: 5/7;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="../Photo/slide1.png" alt="">
        <img src="../Photo/slide2.png" alt="">
        <img src="../Photo/slide3.png" alt="">
        <img src="../Photo/slide4.png" alt="">
        <img src="../Photo/meimeiTaylor.png" alt="">
        <img src="../Photo/ladyFlower.png" alt="">
    </div>
</body>
</html>
