<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            width: 625px;
            height: 315px;
            border: 5px solid gray;
            display: grid;
            margin: 50px auto;
            grid-template-columns:repeat(6, 100px);
            grid-template-rows: repeat(3,100px);

            grid-template-areas:'a a a a e e'
                                'a a a a f f'
                                'b b c d f f'
            ;

            grid-gap: 5px 5px;
            /* box-sizing: border-box; */
        }
        img {
            width: 100%;
            height: 100%;
        }
        .box img:nth-child(1){
            grid-area: a;
        }
        .box img:nth-child(2){
            grid-area: d;
        }
        .box img:nth-child(3){
            grid-area: b;
        }
        .box img:nth-child(4){
            grid-area: c;
        }
        .box img:nth-child(5){
            grid-area: e;
        }
        .box img:nth-child(6){
            grid-area: f;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="../Photo/slide1.png" alt="">
        <img src="../Photo/slide2.png" alt="">
        <img src="../Photo/slide3.png" alt="">
        <img src="../Photo/slide4.png" alt="">
        <img src="../Photo/meimeiTaylor.png" alt="">
        <img src="../Photo/ladyFlower.png" alt="">
    </div>说
</body>
</html>
