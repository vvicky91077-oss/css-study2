<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ul {
            list-style: none;
            position: fixed;
            right: 0;
            top: 300px;

        }

        li {
            width: 200px;
            height: 50px;
            border: 1px solid wheat;
            text-align: center;
            line-height: 50px;
            font-size: 30px;
        }
        div {
            font-size: 50px;
            height: 600px;
            line-height: 600px;
            border: 2px solid salmon;
            background-color: aquamarine;
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="#a">京东秒杀</a></li>
        <li><a href="#b">双十一</a></li>
        <li><a href="#c">频道优选</a></li>
        <li><a href="#d">特色广场</a></li>

    </ul>
    <div id="a">京东秒杀</div>
    <div id="b">双十一</div>
    <div id="c">频道优选</div>
    <div id="d">特色广场</div>
</body>

</html>
