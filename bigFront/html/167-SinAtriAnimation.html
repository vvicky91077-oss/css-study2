<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: rgb(45, 236, 96);
            /* animation: vk2 3s linear 1s  infinite ; */
            animation-name: vk;
            animation-duration: 3s;
            animation-timing-function: ease-in-out;
            animation-delay: 0.5s;
            animation-iteration-count: infinite;
            animation-direction: alternate;

        }
        div:hover {
            animation-play-state: paused;
        }

        @keyframes vk {
            from {
                width: 300px;
                height: 300px;
                background-color: rgb(187, 137, 235);
            }

            to {
                width: 400px;
                height: 600px;
                background-color: rgb(38, 167, 186);
            }
        }
    </style>
</head>
<body>
     <div></div>
</body>
</html>
