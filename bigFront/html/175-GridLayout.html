<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            display: grid;
            width: 600px;
            height: 600px;
            border: 5px solid gold;

            grid-template-rows:1fr 1fr 1fr;
            grid-template-columns:1fr 1fr 1fr;
            grid-row-gap:30px ;
            grid-column-gap: 30px;
            grid-gap: 50px 50px;
        }
        .box div {
            border: 1px solid green;
        }
    </style>
</head>
<body>
    <div class="box">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>
</body>
</html>
