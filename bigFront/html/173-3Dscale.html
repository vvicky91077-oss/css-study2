<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .box {
            width: 500px;
            height: 500px;
            border: 5px solid saddlebrown;
            display: flex;
            transform-style: preserve-3d;

            perspective: 900px;
            
        }
        .center {
            margin: auto;
            width: 200px;
            height: 200px;
            background: red;
            
            /* transform: scaleX(2) scaleY(2); */
            /* transform: scaleY(2); */
            /* transform: scaleZ(-5) rotateX(45deg); */
            transform:scale3d(-1,5,5) rotateX(45deg);
        }
    </style>
</head>
<body>
     <div class="box">
        <div class="center"></div>
    </div>
</body>
</html>
