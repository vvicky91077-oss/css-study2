<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sty {
            width: 300px;
            height: 300px;
            resize: horizontal;
            resize: vertical;
            resize: both;
            resize: none;
            /* 后来者会覆盖 */
        }
    </style>
</head>
<body>
    <h1>多行文本输入框-文本域</h1>
    <textarea cols="10" rows="5"></textarea>
    <br><br>
    <textarea name="" id="" >我感觉
    </textarea>
    <br><br>
    <textarea name="" id="" class="sty" placeholder="请输入"></textarea>
</body>
</html>
