<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        input {
            outline: none;
        }
        div {
            width: 935px;
            height: 120px;
            border: 1px solid #dedede;
            margin: 10px auto;
            background-color: #eceaeb;
            border-radius: 15px;
            box-shadow: 4px 11px 7px #bfbfbf, -4px 11px 7px #bfbfbf;

        }
        [type=text]{
            width: 683px;
            height: 86px;
            margin: 17px;
            border-radius: 4px;
            border: 3px solid #ccc;
            box-shadow: 1px 1px 5px #bfbfbf,-1px 1px 5px #bfbfbf;
            font-size: 25px;
            text-indent: 1em;
        }
        [type=submit]{
            background-color: #209FB6;
            width: 200px;
            height: 86px;
            border-radius: 5px;
            border: 1px solid #5ca3b4;
            color: white;
            font-size: 23px;
        }
    </style>
</head>
<body>
    <form>
        <div>
            <input type="text" placeholder="Search for CSS3, HTML5, JQuery...">
            <input type="submit" value="GO" name="sub">
        </div>
    </form>
</body>
</html>
