<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html,body{
            height: 100%;
        }
        .top, .foot {
            width: 100%;
            height: 50px;
            background-color: tomato;
        }
        .middle {
            width: 100%;
            height: calc(100% - 100px);
            background-color: violet;
        }
        .left,.right {
            width: 100px;
            height: 100px;
            background-color: brown;
            float: left;
        }
        .center {
            width: calc(100% - 200px);
            height: 100%;
            background-color: skyblue;
            float: left;
        }
    </style>
</head>
<body>
    <div class="top"></div>
    <div class="middle">
        <div class="left"></div>
        <div class="center"></div>
        <div class="right"></div>
    </div>
    <div class="foot"></div>
</body>
</html>
