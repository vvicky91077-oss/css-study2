<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            width: 940px;
            height: 300px;
            background-color: silver;
            margin: 0 auto;
        }
        .box1 div {
            margin-right: 20px;
        }
        .box1 div:first-child{
            background-color: aqua;
            width: 300px;
            height: 100%;
            float: left;
        

        }
         .box1 div:last-child{
            background-color: aqua;
            width: 300px;
            height: 100%;
            float: left;
            margin-right: 0;

        }
        .box1 div:nth-child(2){
            background-color: orange;
            width: 300px;
            height: 100%;
            float: left;

        }
        
    </style>
</head>
<body>
    <div class="box1">
        <div></div>
        <div></div>
        <div></div>
    </div>
</body>
        
</html>
