<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 50px;
            background-color: royalblue;
            line-height: 50px;
            text-indent: 20px;
            color: white;

        }
        span {
            width: 0;
            height: 0;
            display: inline-block;
            /* 改成行内块 宽高才会生效 */
            /* background-color: hotpink; */
            border:5px solid transparent;
            border-top: 5px solid #000;
            position: relative;
            top: 2.5px;
        }
        .box:hover span {
            border:5px solid transparent;
            border-bottom:  5px solid #000;
            position: relative;
            top: -2.5px;
        }
    </style>
</head>
<body>
    <div class="box">
        导航
        <span>

        </span>
    </div>
    
</body>
</html>
