    <script>
        //根据 1~12 的数字来输出一个月有多少天,不考虑闰年
        var score=20
        var intScore=parseInt(score/10)
        switch(intScore){
           
                
            case 7:
                document.write("C")
                break;
            case 8:
                document.write("B")
                break;
            
                document.write("31天")
                break;
            
            case 6:
                document.write("D")
                break;
            case 9:
                document.write("A")
                break;
            default:
                document.write("E")
                break;
        }
